<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTG-HCNS · Cát Tường (bản demo)</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="vendor/fa/css/all.min.css">
<link rel="stylesheet" href="app.css?v=9fb9148b52">
<style>
#demobar{position:fixed;left:12px;bottom:12px;z-index:9999;background:#14305c;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:6px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.92}
#demobar a{color:#7fd8a8;cursor:pointer;margin-left:8px;text-decoration:underline}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f5f8fc;font:15px system-ui,sans-serif;color:#14305c;z-index:10000}
#boot img{width:72px}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><img src="logo.png" alt=""><b>CTG-HCNS · HÀNH CHÍNH NHÂN SỰ</b><span id="bootmsg">Đang tải…</span></div>
<div id="demobar" data-keep>Bản demo · nhân sự là dữ liệu giả, lưu trên trình duyệt của bạn<a onclick="window.__ctgReset&&__ctgReset()">Làm mới dữ liệu</a></div>
<script type="module">
import './demo.js?v=406c830c61';
const url = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.12/dist/index.js';
const bar = document.getElementById('demobar');
try {
  await window.__ctgBoot(url);
  for (const s of ['ui.js?v=b79697279f', 'screens.js?v=1e4fbb9379']) await new Promise((res, rej) => { const el = document.createElement('script'); el.src = s; el.onload = res; el.onerror = rej; document.body.append(el); });
  document.getElementById('boot').remove();
  setInterval(() => { if (!bar.isConnected) document.body.append(bar); }, 800);
} catch (e) {
  console.error(e);
  document.getElementById('bootmsg').textContent = 'Không khởi động được bản demo: ' + e.message + ' — hãy thử Chrome/Edge bản mới và tải lại trang.';
}
</script>
</body>
</html>
